<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>UE import smoke fixture (no fonts)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="screen" data-ui-root data-ui-id="NativeSmoke" data-ui-layout="canvas">
    <div class="list" data-ui-id="Cards" data-ui-collection="list">
      <div class="card first" data-ui-id="CardA" data-ui-entry="ColorCard">
        <div class="swatch warm" data-ui-id="SwatchA"></div>
        <div class="swatch cool" data-ui-id="DetailA"></div>
      </div>
      <div class="card second" data-ui-id="CardB" data-ui-entry="ColorCard">
        <div class="swatch cool" data-ui-id="SwatchB"></div>
        <div class="swatch warm" data-ui-id="DetailB"></div>
      </div>
    </div>
    <button class="button" data-ui-id="StaticButton" type="button">
      <div class="indicator" data-ui-id="ButtonIndicator"></div>
    </button>
  </div>
</body>
</html>
